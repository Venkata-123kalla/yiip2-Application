name: CI/CD to Docker Swarm on EC2

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: venkatamahendrakalla/yiip2-app
  SERVICE_NAME: yiip2-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: |
        docker build -t venkatamahendrakalla/yiip2-app:latest .

    - name: Push image to Docker Hub
      run: |
        docker push venkatamahendrakalla/yiip2-app:latest

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

    - name: Deploy on EC2 (Docker Swarm)
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
          set -e
          echo "==> Pulling latest Docker image..."
          docker pull venkatamahendrakalla/yiip2-app:latest

          echo "==> Checking if node is a Swarm manager..."
          if docker info | grep -q 'Swarm: active'; then
              echo "==> Swarm is active. Updating service: yiip2-service"
              docker service update --image venkatamahendrakalla/yiip2-app:latest yiip2-service || {
                  echo "!!! Deployment failed. Attempting rollback..."
                  docker service rollback yiip2-service
                  exit 1
              }
              echo "==> Swarm deployment successful!"
          else
              echo "!!! This node is not a Swarm manager."
              exit 1
              
              ## Uncomment for docker-compose fallback:
              # echo "==> Using docker-compose fallback..."
              # cd /home/ubuntu/your-app-directory
              # docker-compose pull
              # docker-compose up -d
          fi
        EOF
