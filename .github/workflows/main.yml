name: CI/CD to Docker Swarm on EC2

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: venkatamahendrakalla/yiip2-app
  SERVICE_NAME: yiip2-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: docker build -t ${{ env.IMAGE_NAME }}:latest .

    - name: Push image to Docker Hub
      run: docker push ${{ env.IMAGE_NAME }}:latest

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

    - name: Deploy on EC2 (Docker Swarm)
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          set -e
          echo "==> Logging in to EC2 and preparing environment..."

          echo "==> Checking Docker installation..."
          if ! command -v docker &> /dev/null; then
            echo "==> Docker not found. Installing..."
            curl -fsSL https://get.docker.com | sudo sh
            sudo usermod -aG docker ubuntu
            newgrp docker
          fi

          echo "==> Initializing Docker Swarm if needed..."
          if ! docker info | grep -q 'Swarm: active'; then
            docker swarm init || echo "Swarm may already be initialized."
          fi

          echo "==> Pulling latest Docker image..."
          docker pull ${{ env.IMAGE_NAME }}:latest

          echo "==> Deploying or updating Docker Swarm service..."
          if docker service ls | grep -q ${{ env.SERVICE_NAME }}; then
            echo "==> Service exists. Updating..."
            docker service update --image ${{ env.IMAGE_NAME }}:latest ${{ env.SERVICE_NAME }} || {
              echo "!!! Deployment failed. Attempting rollback..."
              docker service rollback ${{ env.SERVICE_NAME }}
              exit 1
            }
          else
            echo "==> Service does not exist. Creating new service..."
            docker service create \
              --name ${{ env.SERVICE_NAME }} \
              --publish 80:80 \
              --restart-condition any \
              ${{ env.IMAGE_NAME }}:latest
          fi

          echo "==> Deployment completed successfully."
        EOF
