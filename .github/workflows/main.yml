name: CI/CD to Docker Swarm on EC2

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: venkatamahendrakalla/yiip2-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: |
        docker build -t $IMAGE_NAME:latest .

    - name: Push image to Docker Hub
      run: |
        docker push $IMAGE_NAME:latest

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

    - name: Deploy on EC2 (Docker Swarm)
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          set -e
          echo "Pulling latest image..."
          docker pull venkatamahendrakalla/yiip2-app:latest

          echo "Updating Docker Swarm service..."
          docker service update --image venkatamahendrakalla/yiip2-app:latest yiip2-service || {
            echo "Deployment failed. Rollback starting..."
            docker service rollback yiip2-service
            exit 1
          }

          echo "Deployment successful!"
        EOF
